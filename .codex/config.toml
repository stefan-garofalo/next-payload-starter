[agents]
max_depth = 1

[features]
hooks = true

[hooks]

# BEGIN hi typegraph (generated by hi update; edits are restored)
[mcp_servers.typegraph_root]
command = "sh"
args = ["-c", 'TYPEGRAPH_PROJECT_ROOT="$(git rev-parse --show-toplevel)" exec node "${XDG_DATA_HOME:-$HOME/.local/share}/hi-tools/typegraph-mcp/0.9.56/node_modules/typegraph-mcp/dist/server.cjs"']
env = { TYPEGRAPH_TSCONFIG = "tsconfig.json" }
enabled_tools = ["ts_find_symbol", "ts_definition", "ts_references", "ts_type_info", "ts_module_exports"]
default_tools_approval_mode = "approve"
startup_timeout_sec = 20
tool_timeout_sec = 60
# END hi typegraph
